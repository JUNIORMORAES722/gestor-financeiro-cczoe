<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | Gestor Financeiro</title>

    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <main class="pagina-login">
      <section class="cartao-login">
        <div class="marca">
          <span class="marca-icone">◆</span>
          <span>GESTOR FINANCEIRO</span>
        </div>

        <div class="cabecalho-login">
          <p class="identificacao">SISTEMA INTERNO</p>

          <h1>Acesso ao<br />sistema</h1>

          <p>
            Entre com seus dados para acessar o painel financeiro.
          </p>
        </div>

        <form id="form-login" class="formulario-login">
          <div class="campo">
            <label for="email">E-mail</label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="admin@igreja.local"
              autocomplete="username"
              required
            />
          </div>

          <div class="campo">
            <label for="senha">Senha</label>

            <input
              type="password"
              id="senha"
              name="senha"
              placeholder="Digite sua senha"
              autocomplete="current-password"
              required
            />
          </div>

          <p id="mensagem-login" class="mensagem-login"></p>

          <button type="submit" class="botao-entrar">
            Entrar no sistema
          </button>
        </form>

        <p class="rodape-login">
          Acesso restrito aos usuários autorizados.
        </p>
      </section>
    </main>

    <script src="/js/app.js"></script>
  </body>
</html>
